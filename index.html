<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>와와학습코칭센터 - 단원평가 관리</title>
<style>
  :root{
    --orange:#F47B36;
    --orange-dark:#E8632A;
    --orange-deep:#C0461A;
    --cream:#FCEBDB;
    --card-bg:#FFFFFF;
    --text:#3a2a18;
    --text-sub:#7a5b3d;
    --line:#EADFCE;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-text-size-adjust:100%;
  }
  .container{
    max-width:720px;
    width:100%;
  }
  .header{
    background:var(--orange);
    border-radius:18px;
    padding:32px 28px;
    text-align:center;
    margin-bottom:24px;
    box-shadow:0 4px 12px rgba(244,123,54,0.15);
  }
  .logo{
    display:inline-flex;
    align-items:center;
    gap:14px;
    margin-bottom:8px;
  }
  .logo-mark{
    width:54px;
    height:54px;
    background:#fff;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:800;
    color:var(--orange-deep);
    letter-spacing:-1px;
  }
  .logo-text{
    text-align:left;
    color:#fff;
  }
  .logo-text .big{
    font-size:24px;
    font-weight:800;
    letter-spacing:3px;
    line-height:1.2;
  }
  .logo-text .small{
    font-size:13px;
    opacity:0.92;
    margin-top:2px;
  }
  .header-sub{
    color:#fff;
    font-size:15px;
    margin-top:14px;
    opacity:0.95;
  }
  .menu-title{
    font-size:16px;
    font-weight:700;
    color:var(--orange-deep);
    margin-bottom:14px;
    padding-left:4px;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border-radius:16px;
    padding:24px;
    text-decoration:none;
    color:var(--text);
    border:2px solid transparent;
    transition:all 0.2s ease;
    display:flex;
    flex-direction:column;
    gap:12px;
    cursor:pointer;
  }
  .card:hover{
    border-color:var(--orange);
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(244,123,54,0.18);
  }
  .card-icon{
    width:56px;
    height:56px;
    background:var(--cream);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
  }
  .card-title{
    font-size:19px;
    font-weight:800;
    color:var(--orange-deep);
  }
  .card-desc{
    font-size:14px;
    color:var(--text-sub);
    line-height:1.5;
  }
  .card-arrow{
    margin-top:auto;
    padding-top:8px;
    color:var(--orange);
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .footer{
    text-align:center;
    margin-top:28px;
    font-size:12px;
    color:var(--text-sub);
    opacity:0.7;
  }
  @media (max-width:520px){
    .header{padding:24px 20px;}
    .logo-text .big{font-size:20px;letter-spacing:2px;}
    .card{padding:20px;}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-mark">W</div>
        <div class="logo-text">
          <div class="big">WAWA</div>
          <div class="small">학습코칭센터</div>
        </div>
      </div>
      <div class="header-sub">단원평가 누적결과 관리 시스템</div>
    </div>

    <div class="menu-title">📚 관리 페이지 선택</div>

    <div class="cards">
      <a href="math-elementary.html" class="card">
        <div class="card-icon">🧮</div>
        <div class="card-title">초등 수학</div>
        <div class="card-desc">초등학생 수학 단원평가 점수를 기록하고 누적 결과를 관리합니다.</div>
        <div class="card-arrow">바로가기 →</div>
      </a>

      <a href="math-middle.html" class="card">
        <div class="card-icon">📐</div>
        <div class="card-title">중·고등 수학</div>
        <div class="card-desc">중고등학생 수학 단원평가 점수를 기록하고 누적 결과를 관리합니다.</div>
        <div class="card-arrow">바로가기 →</div>
      </a>
    </div>

    <div class="footer">
      © WAWA 학습코칭센터
    </div>
  </div>
</body>
</html>
